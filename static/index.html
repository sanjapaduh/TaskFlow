<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Focus — tasks</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth-card">
      <div class="brand"><span class="brand-mark">✓</span><span>Focus</span></div>
      <p class="eyebrow">personal planner</p>
      <h1 id="auth-title">Everything important, at hand</h1>
      <p class="muted" id="auth-subtitle">Sign in to manage your tasks.</p>
      <form id="auth-form" class="stack">
        <label>Username<input id="auth-username" required autocomplete="username"></label>
        <label id="email-field" class="hidden">Email<input id="auth-email" type="email" autocomplete="email"></label>
        <label>Password<input id="auth-password" type="password" required minlength="3" autocomplete="current-password"></label>
        <button class="button primary" type="submit" id="auth-submit">Sign in</button>
      </form>
      <p id="auth-error" class="error" role="alert"></p>
      <button class="link-button" id="auth-toggle" type="button">Create an account</button>
    </section>

    <section id="app-view" class="hidden">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">✓</span><span>Focus</span></div>
        <div class="topbar-actions"><span id="user-name" class="user-name"></span><button id="logout" class="button ghost">Sign out</button></div>
      </header>
      <div class="app-grid">
        <section>
          <div class="page-heading">
            <div><p class="eyebrow">today</p><h1>My tasks</h1></div>
            <button id="new-task" class="button primary">+ New task</button>
          </div>
          <div class="stats"><div><strong id="total-count">0</strong><span>total</span></div><div><strong id="open-count">0</strong><span>open</span></div><div><strong id="done-count">0</strong><span>completed</span></div></div>
          <div class="toolbar"><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="open">Open</button><button class="filter" data-filter="done">Completed</button></div><input id="search" class="search" type="search" placeholder="Search tasks"></div>
          <p id="list-message" class="muted center"></p>
          <div id="task-list" class="task-list"></div>
        </section>
        <aside id="editor" class="editor-card hidden">
          <div class="editor-heading"><h2 id="editor-title">New task</h2><button id="close-editor" class="icon-button" aria-label="Close">×</button></div>
          <form id="task-form" class="stack">
            <label>Task name<input id="task-name" required minlength="3" maxlength="80"></label>
            <label>Description<textarea id="task-description" required minlength="3" maxlength="25" rows="3"></textarea></label>
            <label>Importance <span id="importance-value">5</span><input id="task-importance" type="range" min="0" max="10" value="5"></label>
            <label>Tag<input id="task-tag" maxlength="15" placeholder="for example, work"></label>
            <label>Tag color<select id="task-color"><option value="BLUE">Blue</option><option value="GREEN">Green</option><option value="RED">Red</option><option value="WHITE">White</option></select></label>
            <label class="checkbox"><input id="task-done" type="checkbox"> Completed</label>
            <button class="button primary" type="submit">Save task</button>
          </form>
          <p id="task-error" class="error" role="alert"></p>
        </aside>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
