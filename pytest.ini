[pytest]
# Папка, где лежат наши тесты
testpaths = tests

# auto позволяет не писать @pytest.mark.asyncio над каждым асинхронным тестом
asyncio_mode = auto

# Флаги по умолчанию (подробный вывод и разрешение принтов)
addopts = -v -s

# Игнорируем предупреждения от сторонних библиотек
filterwarnings =
    ignore::DeprecationWarning